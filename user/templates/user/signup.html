{% extends 'base.html' %}

{% block title %}
<div class="h1">アカウントを新規登録</div>
{% endblock %}

{% block content %}
<div>
  <form method="POST">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    {{ field.label }}
    {{ field }}
    {{ field.errors }}
    {% endfor %}
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">登録</button>
      <a href="{% url 'index' %}" class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
