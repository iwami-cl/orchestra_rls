[uwsgi]
env = OTONOSU_SETTINGS=/root/.otonosu
chdir = /usr/local/dialog_pf/otonosu/orchestra_rls
module = orchestra_rls.wsgi:application

manage-script-name = true

# 仮想環境
virtualenv = /usr/local/pyenv/versions/3.13.7/envs/otonosu-venv

master = true
processes = 5

socket = /var/run/uwsgi/otonosu.sock
chmod-socket = 666
pidfile = /var/run/uwsgi/otonosu.pid

catch-print = true
logto = /var/log/uwsgi/otonosu.log